{% extends "base.html" %}{% block title %}Login | GreenRide{% endblock %}{% block content %}
<section class="form-wrap"><p class="eyebrow">WELCOME BACK</p><h1>Login to GreenRide</h1><p class="muted">Access your bookings and tickets.</p>
{% if message %}<div class="alert success">{{ message }}</div>{% endif %}{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form class="panel" method="post" action="/login"><label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label><button class="button wide">Login</button>
<p class="center muted">New here? <a href="/register">Create an account</a></p></form></section>{% endblock %}
